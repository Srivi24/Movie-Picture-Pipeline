name: frontend-ci-workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
jobs:
  lint-job:
    name: Frontend Lint
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 18.14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # - name: Move to frontend directory
      #   run: 'cd starter/frontend'
      - name: Install Dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Run Linter
        working-directory: starter/frontend
        run: npm run lint
  test-job:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 18.14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # - name: Move to frontend directory
      #   run: 'cd starter/frontend'
      - name: Install Dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Testing job
        working-directory: starter/frontend
        run: CI=true npm run test
  build-job:
    name: Build and Run Frontend Docker Image
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest
    env:
      REACT_APP_MOVIE_API_URL: 'http://localhost:5000'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v4
      # - name: Move to frontend directory
      #   run: 'cd starter/frontend'
      - name: Build production Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag=mp-frontend:latest \
            .
      - name: Run production container
        working-directory: starter/frontend
        run: |
          docker run \
          --name mp-frontend \
          -p 3000:3000 \
          -d \
          mp-frontend:latest
