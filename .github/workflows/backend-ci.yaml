name: backend-ci-workflow

on:
  workflow_dispatch:
  # pull_request:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
env:
  PYTHON_VERSION: "3.10"
jobs:
  lint-job:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: 'pip'
      # - name: Install pipx
      #   run: sudo apt install pipx -y
      - name: Install pipenv
        # run: pipx install pipenv
        run: python -m pip install pipenv
      # - name: Move to backend directory
      #   run: 'cd starter/backend'
      - name: Install dependencies
        working-directory: starter/backend
        # run: pipenv install
        # run: pipenv sync --dev
        run: pipenv install --dev
      - name: Run Linter
        working-directory: starter/backend
        run: pipenv run lint
  test-job:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: 'pip'
      # - name: Install pipx
      #   run: sudo apt install pipx -y
      - name: Install pipenv
        # run: pipx install pipenv
        run: python -m pip install pipenv
      # - name: Move to backend directory
      #   run: 'cd starter/backend'
      - name: Install dependencies
        working-directory: starter/backend
        # run: pipenv install
        # run: pipenv sync --dev
        run: pipenv install --dev
      - name: Running tests
        working-directory: starter/backend
        run: pipenv run test
  build-job:
    name: Build and Run Backend Docker Image
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # - name: Move to backend directory
      #   run: 'cd starter/backend'
      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build --tag mp-backend:latest .
      - name: Run Docker container
        working-directory: starter/backend
        run: |
          docker run \
          -d \
          -p 5000:5000 \
          --name mp-backend \
          mp-backend:latest
      - name: Check the running application
        working-directory: starter/backend
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/movies; then
              exit 0
            fi
            sleep 2
          done
          docker logs mp-backend
          exit 1
      - name: Review logs
        if: always()
        run: docker logs mp-backend